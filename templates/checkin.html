{% extends "base.html" %}
{% load static %}
{% block title %}在线签到 - 人脸考勤系统{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-camera-video me-2"></i>在线签到</h5>
                <div>
                    <span id="scanIndicator" class="badge bg-light text-dark">
                        <span class="spinner-grow spinner-grow-sm text-success me-1"></span>自动识别中
                    </span>
                </div>
            </div>
            <div class="card-body p-4">
                {% csrf_token %}
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">视频来源</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="source" id="sourceLocal" value="local" checked>
                            <label class="btn btn-outline-primary" for="sourceLocal"><i class="bi bi-webcam me-1"></i>本地摄像头</label>
                            <input type="radio" class="btn-check" name="source" id="sourceIp" value="ip">
                            <label class="btn btn-outline-primary" for="sourceIp"><i class="bi bi-broadcast me-1"></i>IP Webcam</label>
                        </div>
                    </div>
                    <div class="col-md-6" id="ipInput" style="display:none">
                        <label class="form-label">IP Webcam 地址</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="webcamUrl" placeholder="http://10.12.28.66:8080/">
                            <button class="btn btn-primary" type="button" id="connectIp"><i class="bi bi-link-45deg me-1"></i>连接</button>
                        </div>
                    </div>
                </div>

                <div class="text-center mb-3 position-relative">
                    <video id="video" class="rounded shadow-sm" width="640" height="480" autoplay playsinline style="max-width:100%"></video>
                    <img id="ipStream" class="rounded shadow-sm" width="640" height="480" style="display:none; max-width:100%" alt="IP Webcam 画面">
                    <div id="scanOverlay" class="position-absolute top-0 start-50 translate-middle-x mt-2">
                        <span class="badge bg-dark bg-opacity-75 px-3 py-2"><i class="bi bi-person-bounding-box me-1"></i>请面对摄像头，系统将自动识别签到</span>
                    </div>
                </div>

                <div id="msg" class="alert mt-4 mb-0 d-none" role="alert"></div>

                <!-- 签到成功卡片 -->
                <div id="resultCard" class="card border-success mt-4 d-none">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-auto">
                                <img id="resultPhoto" class="rounded-circle shadow-sm" style="width:80px;height:80px;object-fit:cover" src="" alt="">
                                <div id="resultNoPhoto" class="rounded-circle bg-success bg-opacity-10 d-inline-flex align-items-center justify-content-center" style="width:80px;height:80px;display:none!important">
                                    <i class="bi bi-person-check display-6 text-success"></i>
                                </div>
                            </div>
                            <div class="col">
                                <h5 class="mb-1" id="resultName"></h5>
                                <p class="text-muted mb-1"><i class="bi bi-person-badge me-1"></i><span id="resultId"></span></p>
                                <p class="text-muted mb-1"><i class="bi bi-clock me-1"></i><span id="resultTime"></span></p>
                                <span id="resultBadge" class="badge"></span>
                            </div>
                            <div class="col-auto">
                                <i class="bi bi-check-circle-fill display-4 text-success"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<canvas id="canvas" style="display:none" width="640" height="480"></canvas>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/camera.js' %}?v=4"></script>
{% endblock %}
