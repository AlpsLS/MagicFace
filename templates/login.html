{% extends "base.html" %}
{% block title %}登录 - 人脸考勤系统{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>用户登录</h5>
            </div>
            <div class="card-body p-4">
                {% if form.errors %}
                <div class="alert alert-danger">用户名或密码错误，请重试。</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control form-control-lg" placeholder="请输入用户名" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>登录
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
